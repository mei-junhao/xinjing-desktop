name: Internal Mac Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps electron@43.2.0 electron-builder@24.13.3

      - name: Generate runtime files
        env:
          LICENSE_SECRET: ${{ secrets.LICENSE_SECRET }}
          APP_PROXY_KEY: ${{ secrets.APP_PROXY_KEY }}
        run: |
          node scripts/codegen-secret.js
          node scripts/codegen-version.js
          python3 scripts/gen-knowledge-builtins.py
          python3 scripts/gen-prompts-builtin.py || echo "Using committed prompt bundle"

      - name: Fix 7za for current macOS
        run: |
          set -e
          curl -fSL -o /tmp/7z-mac.tar.xz "https://github.com/ip7z/7zip/releases/download/26.02/7z2602-mac.tar.xz" \
            || curl -fSL -o /tmp/7z-mac.tar.xz "https://7-zip.org/a/7z2602-mac.tar.xz"
          mkdir -p /tmp/7zmac
          tar -xf /tmp/7z-mac.tar.xz -C /tmp/7zmac
          src=$(find /tmp/7zmac -name 7zz -type f | head -1)
          [ -n "$src" ] || src=$(find /tmp/7zmac -name 7zzs -type f | head -1)
          [ -n "$src" ] || { echo "7zz missing"; exit 1; }
          arch=$(uname -m)
          if [ "$arch" = arm64 ]; then destination=mac/arm64/7za; else destination=mac/x64/7za; fi
          mkdir -p "node_modules/7zip-bin/$(dirname "$destination")"
          cp "$src" "node_modules/7zip-bin/$destination"
          chmod +x "node_modules/7zip-bin/$destination"

      - name: Build unsigned candidate
        run: npx electron-builder --mac --publish never --config.mac.icon=build/icon-mac.png

      - name: Create mountable DMG
        run: |
          set -e
          app=$(find dist -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "App bundle missing"; exit 1; }
          version=$(node -p "require('./package.json').version")
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname XinJing -srcfolder "$staging" -ov -format UDZO "dist/xinjing-${version}.dmg"
          rm -rf "$staging"

      - name: Generate and verify update metadata
        run: |
          set -e
          node scripts/postbuild.js
          version=$(node -p "require('./package.json').version")
          dmg="dist/xinjing-${version}.dmg"
          zip="dist/xinjing-${version}.zip"
          test -s "$dmg"
          test -s "$zip"
          test -s dist/latest-mac.yml
          unzip -t "$zip"
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          test -n "$(find "$mount" -maxdepth 1 -name '*.app' -type d -print -quit)"
          hdiutil detach "$mount"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const version = require('./package.json').version;
          const raw = fs.readFileSync('dist/latest-mac.yml', 'utf8');
          const path = (raw.match(/^path:\s*(.+)$/m) || [])[1];
          const size = Number((raw.match(/^    size:\s*(\d+)$/m) || [])[1]);
          const sha512 = (raw.match(/^    sha512:\s*(.+)$/m) || [])[1];
          if (!path || !sha512 || !raw.includes('version: ' + version)) throw new Error('invalid latest-mac.yml');
          const bytes = fs.readFileSync('dist/' + path);
          const actual = crypto.createHash('sha512').update(bytes).digest('base64');
          if (bytes.length !== size || actual !== sha512) throw new Error('latest-mac.yml hash or size mismatch');
          console.log(JSON.stringify({ version, path, size, sha512 }, null, 2));
          NODE

      - name: Upload internal candidate
        uses: actions/upload-artifact@v4
        with:
          name: xinjing-macos-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/xinjing-*.dmg
            dist/xinjing-*.zip
            dist/*.blockmap
            dist/latest-mac.yml
