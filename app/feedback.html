<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心镜 · 意见建议</title>
  <link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   全局视觉增强 — 暖色治愈系（追加层，不修改任何已有选择器）
   注入到每个页面 style 结束标签前
   ============================================================ */

/* 入场动画 */
@keyframes xjFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes xjFadeIn{from{opacity:0}to{opacity:1}}
@keyframes xjScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* 通用交互增强 */
[data-xj-enhance] *{box-sizing:border-box}

/* 卡片悬停增强（追加到已有卡片选择器，不覆盖） */
.card:hover,.list-card:hover,.stat-card:hover,.kv-card:hover,.mod:hover,.sc-ov-card:hover,
.analysis-block:hover,.ccard:hover,.tcard:hover{
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}

/* 输入框聚焦增强 */
textarea:focus,input:focus,select:focus{
  transition:border-color .2s ease,box-shadow .2s ease;
}

/* 按钮点击反馈 */
button:active{
  transform:scale(.97);
  transition:transform .1s ease;
}

/* 滚动条美化 */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border,#ECE5D9);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong,#DDD4C5)}


    
﻿
    /* === xinjing enhance === */
    /* form field focus glow */
    .xj-field-glow{transition:border-color .25s ease,box-shadow .25s ease,background .2s ease}
    .xj-field-glow:focus{border-color:var(--accent,#9E5A3C);box-shadow:0 0 0 3px rgba(158,90,60,.12);background:#fff}
    /* textarea resize handle styling */
    .xj-textarea-handle{resize:vertical;min-height:100px;transition:border-color .2s ease,box-shadow .2s ease}
    .xj-textarea-handle:focus{border-color:var(--accent,#9E5A3C);box-shadow:0 0 0 3px rgba(158,90,60,.1)}
    .xj-textarea-handle::-webkit-resizer{background:transparent;border:2px solid var(--border,#ECE5D9);border-radius:0 0 8px 0;width:12px;height:12px}
    /* submit button hover lift */
    .xj-submit-btn{transition:transform .25s ease,box-shadow .25s ease,filter .2s ease,background .2s ease}
    .xj-submit-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(158,90,60,.18);filter:brightness(1.04)}
    .xj-submit-btn:active{transform:translateY(0) scale(.97);box-shadow:none}
    /* rating/score indicator transitions */
    .xj-score-indicator{transition:color .3s ease,transform .3s ease,background .3s ease}
    .xj-score-indicator:hover{transform:scale(1.15)}
    .xj-score-indicator.xj-selected{color:var(--accent,#9E5A3C);transform:scale(1.2)}
    @keyframes xjScorePop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1.2)}}
    .xj-score-indicator.xj-pop{animation:xjScorePop .3s ease}

  </style>
  <link rel="stylesheet" href="css/workbench.css">
  <link rel="stylesheet" href="css/xj-ui-system.css">
</head>
<body data-xj-pattern="form-workspace">
  <div class="layout">
    <div id="sidebar-mount"></div>
    <main class="main">
      <header class="main-header">
        <div id="page-header"></div>
      </header>
      <div class="content">
        <div class="list-card" style="padding:var(--gap-lg);cursor:default">
          <div class="section-title"><i data-lucide="message-square-more"></i>意见建议</div>
          <p style="font-family:var(--sans);font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:var(--gap)">
            心镜是一个本地运行的个人工具。如果你有功能建议或发现问题，可以通过以下方式反馈：
          </p>
          <div style="font-family:var(--sans);font-size:14px;line-height:2">
            <i data-lucide="messages-square"></i>微信联系开发者<br>
            <i data-lucide="mail"></i>邮件：<a href="mailto:985729106@qq.com" style="color:var(--accent)">985729106@qq.com</a>
          </div>
        </div>
        <div class="list-card" style="padding:var(--gap-lg);cursor:default;margin-top:var(--gap-lg)">
          <div class="section-title"><i data-lucide="clipboard-pen-line"></i>提交反馈</div>
          <p style="font-family:var(--sans);font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 var(--gap)">
            「本地保存草稿」只写入本机，不会发送；「发送反馈」会打开你的邮件客户端。发送失败或未发送时，你填写的内容和选择的附件都会保留。
          </p>
          <label for="fb-text" style="display:block;font:600 13px var(--sans);margin:0 0 6px">反馈内容</label>
          <textarea id="fb-text" rows="6" placeholder="描述你的建议或遇到的问题…" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:14px var(--sans);background:var(--bg);color:var(--text);resize:vertical;box-sizing:border-box;display:block"></textarea>
          <div style="margin:12px 0">
            <label for="fb-attachment" style="font:13px var(--sans);color:var(--ink-2)">附件（可多选，仅随本地草稿保存）</label>
            <input type="file" id="fb-attachment" multiple style="display:block;margin-top:6px;font:13px var(--sans)">
          </div>
          <div id="fb-status" role="status" aria-live="polite" style="min-height:18px;font:12px var(--sans);color:var(--muted);margin:0 0 10px"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" id="fb-save" class="btn btn-outline">本地保存草稿</button>
            <button type="button" id="fb-send" class="btn btn-primary">发送反馈</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/clinical-task-validators.js"></script><script src="js/store.js"></script><script src="js/entitlements.js"></script><script src="js/ai.js"></script><script src="js/agent-tools.js"></script><script src="js/agent-core.js"></script><script src="js/page-hints.js"></script><script src="js/icon-system.js"></script><script src="js/xinjing-chat.js"></script><script src="js/app.js"></script>
  <script>
    App.initPage({
      title: '意见建议',
      subtitle: '你的反馈让心镜更好',
    });
  </script>
  <script>
  (function () {
    'use strict';
    var DRAFT_KEY = 'xj_feedback_draft';
    var text = document.getElementById('fb-text');
    var file = document.getElementById('fb-attachment');
    var status = document.getElementById('fb-status');
    var saveBtn = document.getElementById('fb-save');
    var sendBtn = document.getElementById('fb-send');
    if (!text || !saveBtn || !sendBtn) return;

    function attachmentNames() {
      var list = file && file.files ? Array.prototype.slice.call(file.files) : [];
      return list.map(function (f) { return f.name; });
    }
    function setStatus(msg, ok) {
      status.textContent = msg;
      status.style.color = ok === true ? 'var(--success,#6E7E62)' : (ok === false ? 'var(--danger,#B85450)' : 'var(--muted)');
    }
    function persistDraft() {
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ text: text.value, attachments: attachmentNames(), savedAt: new Date().toISOString() }));
        return true;
      } catch (e) { return false; }
    }

    // 恢复本机草稿（仅展示，不自动发送）
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (raw) {
        var draft = JSON.parse(raw);
        if (draft && typeof draft.text === 'string') text.value = draft.text;
        if (draft && Array.isArray(draft.attachments) && draft.attachments.length) {
          setStatus('已恢复本机草稿（未发送）· 附件：' + draft.attachments.join('、'), null);
        }
      }
    } catch (e) {}

    saveBtn.addEventListener('click', function () {
      if (!text.value.trim() && !attachmentNames().length) { setStatus('内容为空，未保存', false); return; }
      if (persistDraft()) setStatus('已保存草稿到本机（未发送）', true);
      else setStatus('本地保存失败，内容仍保留在页面', false);
    });

    sendBtn.addEventListener('click', function () {
      var body = (text.value || '').trim();
      if (!body && !attachmentNames().length) { setStatus('请先填写反馈内容或选择附件', false); text.focus(); return; }
      // 发送边界：宿主提供反馈接口则调用；否则打开邮件客户端（附件仅保留本地，不随邮件发送）
      if (window.__XJ_API__ && typeof window.__XJ_API__.sendFeedback === 'function') {
        sendBtn.disabled = true;
        var label = sendBtn.textContent;
        sendBtn.textContent = '发送中…';
        window.__XJ_API__.sendFeedback({ text: body, attachments: attachmentNames() }).then(function (r) {
          sendBtn.disabled = false; sendBtn.textContent = label;
          if (r && r.ok) setStatus('反馈已发送', true);
          else setStatus('发送失败，内容与附件选择已保留', false);
        }).catch(function () {
          sendBtn.disabled = false; sendBtn.textContent = label;
          setStatus('发送失败，内容与附件选择已保留', false);
        });
        return;
      }
      var subject = encodeURIComponent('心镜反馈');
      var mail = encodeURIComponent(body + '\n\n（附件：' + (attachmentNames().join('、') || '无') + ' — 请手动附上）');
      try {
        location.href = 'mailto:985729106@qq.com?subject=' + subject + '&body=' + mail;
        setStatus('已请求打开邮件客户端，请确认邮件窗口已出现。内容仍保留在本页（附件请手动添加）', null);
      } catch (e) {
        setStatus('发送失败，内容与附件选择已保留', false);
      }
    });
  })();
  </script>
</body>
</html>
